<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="seasonal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c2d12;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3f1f0d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1f0908;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="harvest-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#d97706;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:0" />
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#seasonal-grad)"/>
  <g opacity="0.25">
    <circle cx="280" cy="320" r="90" fill="url(#harvest-glow)"/>
    <circle cx="280" cy="320" r="90" fill="none" stroke="#d97706" stroke-width="2"/>
    <circle cx="250" cy="290" r="12" fill="#d97706"/>
    <circle cx="310" cy="300" r="10" fill="#d97706"/>
    <circle cx="280" cy="360" r="14" fill="#d97706"/>
  </g>
  <g opacity="0.2">
    <polygon points="950,250 1010,450 890,450" fill="#b45309" opacity="0.2"/>
    <circle cx="950" cy="280" r="50" fill="none" stroke="#d97706" stroke-width="1.5"/>
  </g>
  <text x="600" y="700" font-family="Inter, Arial" font-size="44" font-weight="bold" fill="#fed7aa" text-anchor="middle">Seasonal Favorites</text>
</svg>
