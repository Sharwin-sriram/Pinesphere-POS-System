<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="desserts-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#831843;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#500724;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1f0933;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="cake-glow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:0" />
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#desserts-grad)"/>
  <g opacity="0.3">
    <circle cx="350" cy="350" r="85" fill="url(#cake-glow)"/>
    <circle cx="350" cy="350" r="85" fill="none" stroke="#ec4899" stroke-width="2"/>
    <rect x="320" y="265" width="60" height="120" fill="#ec4899" opacity="0.25" rx="4"/>
    <circle cx="350" cy="250" r="15" fill="#f472b6" opacity="0.4"/>
  </g>
  <g opacity="0.25">
    <polygon points="900,550 950,400 1000,550" fill="#ec4899" opacity="0.2"/>
    <circle cx="900" cy="550" r="40" fill="none" stroke="#f472b6" stroke-width="1.5"/>
    <circle cx="950" cy="540" r="8" fill="#fbbf24" opacity="0.5"/>
    <circle cx="1000" cy="550" r="40" fill="none" stroke="#f472b6" stroke-width="1.5"/>
  </g>
  <g opacity="0.15" stroke="#ec4899" stroke-width="2">
    <line x1="200" y1="200" x2="250" y2="260"/>
    <line x1="1100" y1="700" x2="1050" y2="630"/>
  </g>
  <text x="600" y="700" font-family="Inter, Arial" font-size="44" font-weight="bold" fill="#fbcfe8" text-anchor="middle">Decadent Desserts</text>
</svg>