  <circle cx="164" cy="160" r="150" fill="#8b5cf6" fill-opacity=".12" />
  <rect x="118" y="124" width="964" height="552" rx="48" fill="#08111d" fill-opacity=".72" stroke="#ffffff" stroke-opacity=".08" />
