<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Service metrics illustration</title>
  <desc id="desc">A service performance graphic for restaurant operations dashboards.</desc>
  <defs>
