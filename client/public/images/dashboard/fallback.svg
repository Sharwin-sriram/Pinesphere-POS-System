<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bgGradient)"/>
  
  <!-- Analytics dashboard representation -->
  <g opacity="0.7">
    <!-- Charts -->
    <rect x="100" y="80" width="400" height="200" rx="15" fill="none" stroke="#8b5cf6" stroke-width="2"/>
    <path d="M 130 220 L 160 200 L 190 240 L 220 160 L 250 200 L 280 140 L 310 180 L 340 100 L 370 150" stroke="#3b82f6" stroke-width="3" fill="none"/>
    
    <rect x="700" y="80" width="400" height="200" rx="15" fill="none" stroke="#10b981" stroke-width="2"/>
    <rect x="730" y="240" width="30" height="40" fill="#10b981" opacity="0.6"/>
    <rect x="780" y="180" width="30" height="100" fill="#10b981" opacity="0.7"/>
    <rect x="830" y="140" width="30" height="140" fill="#10b981" opacity="0.8"/>
  </g>
  
  <!-- Data indicators -->
  <g opacity="0.6">
    <circle cx="200" cy="350" r="40" fill="#fbbf24" opacity="0.5"/>
    <text x="200" y="360" font-size="20" font-weight="bold" text-anchor="middle" fill="#fbbf24">+24%</text>
    
    <circle cx="600" cy="350" r="40" fill="#f87171" opacity="0.5"/>
    <text x="600" y="360" font-size="20" font-weight="bold" text-anchor="middle" fill="#f87171">-12%</text>
    
    <circle cx="1000" cy="350" r="40" fill="#10b981" opacity="0.5"/>
    <text x="1000" y="360" font-size="20" font-weight="bold" text-anchor="middle" fill="#10b981">+38%</text>
  </g>
  
  <!-- Text -->
  <text x="600" y="510" font-size="44" font-weight="bold" text-anchor="middle" fill="#8b5cf6" opacity="0.9">Dashboard Analytics</text>
  <text x="600" y="560" font-size="20" text-anchor="middle" fill="#e0e7ff" opacity="0.7">Menu performance and revenue insights</text>
</svg>
