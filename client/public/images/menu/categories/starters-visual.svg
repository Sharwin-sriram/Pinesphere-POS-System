<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bgGradient)"/>
  
  <!-- Starters arrangement - small bites -->
  <g opacity="0.85">
    <!-- First appetizer -->
    <circle cx="300" cy="200" r="80" fill="#d4af37" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="300" cy="200" r="70" fill="#c97f3a"/>
    <circle cx="280" cy="190" r="20" fill="#10b981" opacity="0.8"/>
    
    <!-- Second appetizer -->
    <circle cx="600" cy="180" r="85" fill="#e8b4a0" stroke="#f87171" stroke-width="2"/>
    <circle cx="600" cy="180" r="75" fill="#f87171" opacity="0.7"/>
    <circle cx="630" cy="170" r="22" fill="#fbbf24" opacity="0.7"/>
    
    <!-- Third appetizer -->
    <circle cx="900" cy="210" r="80" fill="#8b7355" stroke="#d4af37" stroke-width="2"/>
    <circle cx="900" cy="210" r="70" fill="#a68968"/>
    <circle cx="920" cy="200" r="18" fill="#e0e7ff" opacity="0.6"/>
  </g>
  
  <!-- Decorative base lines -->
  <line x1="150" y1="350" x2="1050" y2="350" stroke="#8b5cf6" stroke-width="2" opacity="0.3"/>
  <line x1="150" y1="360" x2="1050" y2="360" stroke="#3b82f6" stroke-width="1" opacity="0.2"/>
  
  <!-- Text -->
  <text x="600" y="480" font-size="44" font-weight="bold" text-anchor="middle" fill="#fbbf24" opacity="0.9">Starters & Appetizers</text>
  <text x="600" y="535" font-size="20" text-anchor="middle" fill="#e0e7ff" opacity="0.7">Perfect for sharing and starting your meal</text>
</svg>