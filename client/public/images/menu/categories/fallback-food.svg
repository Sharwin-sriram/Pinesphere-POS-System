<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="plateGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#f5f5dc;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#d4af37;stop-opacity:0.8" />
    </radialGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bgGradient)"/>
  
  <!-- Main plate -->
  <circle cx="600" cy="320" r="250" fill="url(#plateGradient)" stroke="#8b5cf6" stroke-width="3" opacity="0.9"/>
  <circle cx="600" cy="320" r="240" fill="none" stroke="#e0e7ff" stroke-width="1" opacity="0.5"/>
  
  <!-- Food representation -->
  <ellipse cx="600" cy="280" rx="120" ry="90" fill="#c97f3a" opacity="0.85"/>
  <ellipse cx="560" cy="300" rx="60" ry="70" fill="#22c55e" opacity="0.75"/>
  <ellipse cx="640" cy="310" rx="70" ry="50" fill="#ef4444" opacity="0.75"/>
  
  <!-- Garnish -->
  <circle cx="480" cy="240" r="25" fill="#10b981" opacity="0.7"/>
  <circle cx="720" cy="250" r="20" fill="#fbbf24" opacity="0.7"/>
  <circle cx="500" cy="360" r="22" fill="#f87171" opacity="0.6"/>
  
  <!-- Sauce drizzle -->
  <path d="M 650 350 Q 700 370 750 360" stroke="#1f2937" stroke-width="3" fill="none" opacity="0.6"/>
  
  <!-- Premium text -->
  <text x="600" y="520" font-size="44" font-weight="bold" text-anchor="middle" fill="#8b5cf6" opacity="0.9">Premium Dish</text>
  <text x="600" y="570" font-size="20" text-anchor="middle" fill="#e0e7ff" opacity="0.7">Handcrafted culinary excellence</text>
</svg>