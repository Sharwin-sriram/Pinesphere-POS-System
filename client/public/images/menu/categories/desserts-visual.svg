<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bgGradient)"/>
  
  <!-- Dessert 1 - Cake -->
  <g opacity="0.85">
    <rect x="150" y="150" width="200" height="220" rx="15" fill="#8b4513"/>
    <rect x="160" y="140" width="180" height="25" rx="10" fill="#d4af37"/>
    <circle cx="250" cy="130" r="25" fill="#fbbf24" opacity="0.8"/>
    <circle cx="220" cy="120" r="18" fill="#10b981" opacity="0.7"/>
  </g>
  
  <!-- Dessert 2 - Macarons -->
  <g opacity="0.85">
    <circle cx="600" cy="240" r="50" fill="#ff69b4"/>
    <circle cx="650" cy="210" r="48" fill="#ffb6c1"/>
    <circle cx="560" cy="220" r="45" fill="#ffc0cb"/>
    <circle cx="620" cy="290" r="48" fill="#ff69b4"/>
  </g>
  
  <!-- Dessert 3 - Chocolate mousse -->
  <g opacity="0.85">
    <ellipse cx="950" cy="280" rx="120" ry="100" fill="#3d2817"/>
    <ellipse cx="950" cy="280" rx="110" ry="90" fill="#5c3d2e"/>
    <ellipse cx="930" cy="260" rx="40" ry="30" fill="#fbbf24" opacity="0.6"/>
    <ellipse cx="970" cy="265" rx="35" ry="28" fill="#fbbf24" opacity="0.5"/>
  </g>
  
  <!-- Text -->
  <text x="600" y="480" font-size="44" font-weight="bold" text-anchor="middle" fill="#ff69b4" opacity="0.9">Desserts & Sweet Treats</text>
  <text x="600" y="535" font-size="20" text-anchor="middle" fill="#e0e7ff" opacity="0.7">Indulgent creations to end your meal</text>
</svg>