<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bgGradient)"/>
  
  <!-- Beverage glasses arrangement -->
  <g opacity="0.9">
    <!-- Cocktail 1 -->
    <rect x="200" y="150" width="80" height="180" rx="10" fill="#ff6b6b" opacity="0.8"/>
    <ellipse cx="240" cy="150" rx="45" ry="15" fill="#ff8c8c"/>
    <circle cx="220" cy="100" r="15" fill="#fbbf24" opacity="0.6"/>
    
    <!-- Cocktail 2 -->
    <rect x="500" y="120" width="85" height="200" rx="10" fill="#4ecdc4" opacity="0.8"/>
    <ellipse cx="542.5" cy="120" rx="47" ry="15" fill="#5ee7de"/>
    <circle cx="520" cy="60" r="18" fill="#10b981" opacity="0.6"/>
    <circle cx="560" cy="70" r="15" fill="#fbbf24" opacity="0.5"/>
    
    <!-- Cocktail 3 -->
    <rect x="800" y="160" width="80" height="170" rx="10" fill="#ffe66d" opacity="0.8"/>
    <ellipse cx="840" cy="160" rx="45" ry="15" fill="#ffed99"/>
    <circle cx="820" cy="110" r="16" fill="#ef4444" opacity="0.6"/>
  </g>
  
  <!-- Decorative ice cubes -->
  <g opacity="0.5">
    <rect x="230" y="140" width="20" height="20" fill="#e0e7ff"/>
    <rect x="250" y="135" width="18" height="18" fill="#e0e7ff"/>
    <rect x="530" y="140" width="22" height="22" fill="#e0e7ff"/>
    <rect x="810" y="150" width="20" height="20" fill="#e0e7ff"/>
  </g>
  
  <!-- Text -->
  <text x="600" y="480" font-size="44" font-weight="bold" text-anchor="middle" fill="#4ecdc4" opacity="0.9">Craft Beverages</text>
  <text x="600" y="535" font-size="20" text-anchor="middle" fill="#e0e7ff" opacity="0.7">Premium drinks and specialty cocktails</text>
</svg>