<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="priceGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#d4af37;stop-opacity:0.8" />
    </radialGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bgGradient)"/>
  
  <!-- Premium plate display -->
  <circle cx="600" cy="280" r="200" fill="url(#priceGrad)" stroke="#fbbf24" stroke-width="2" opacity="0.5"/>
  <circle cx="600" cy="280" r="190" fill="#1a1a2e" stroke="#e0e7ff" stroke-width="1" opacity="0.3"/>
  
  <!-- Premium dish -->
  <g opacity="0.9">
    <ellipse cx="600" cy="270" rx="120" ry="100" fill="#c97f3a"/>
    <circle cx="570" cy="240" r="30" fill="#10b981" opacity="0.8"/>
    <circle cx="630" cy="250" r="28" fill="#fbbf24" opacity="0.8"/>
    <path d="M 550 320 Q 600 340 650 320" stroke="#8b4513" stroke-width="3" fill="none" opacity="0.6"/>
  </g>
  
  <!-- Price indicators -->
  <g opacity="0.8">
    <text x="300" y="200" font-size="32" font-weight="bold" fill="#fbbf24">$48</text>
    <text x="900" y="200" font-size="32" font-weight="bold" fill="#fbbf24">$52</text>
    <text x="300" y="400" font-size="32" font-weight="bold" fill="#fbbf24">$42</text>
    <text x="900" y="400" font-size="32" font-weight="bold" fill="#fbbf24">$58</text>
  </g>
  
  <!-- Text -->
  <text x="600" y="510" font-size="44" font-weight="bold" text-anchor="middle" fill="#fbbf24" opacity="0.9">Premium Pricing</text>
  <text x="600" y="560" font-size="20" text-anchor="middle" fill="#e0e7ff" opacity="0.7">Fine dining experience with dynamic pricing</text>
</svg>