<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="priceGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#d4af37;stop-opacity:0.8" />
    </radialGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bgGradient)"/>
  
  <!-- Fine dining plated presentation -->
  <circle cx="600" cy="280" r="200" fill="url(#priceGrad)" stroke="#fbbf24" stroke-width="3" opacity="0.5"/>
  <circle cx="600" cy="280" r="190" fill="#1a1a2e" stroke="#e0e7ff" stroke-width="1" opacity="0.3"/>
  
  <!-- Premium dish components -->
  <g opacity="0.9">
    <!-- Protein -->
    <ellipse cx="600" cy="260" rx="80" ry="70" fill="#c97f3a"/>
    
    <!-- Artful vegetable arrangement -->
    <circle cx="550" cy="230" r="22" fill="#22c55e" opacity="0.8"/>
    <circle cx="650" cy="220" r="24" fill="#fbbf24" opacity="0.8"/>
    <circle cx="630" cy="300" r="20" fill="#ef4444" opacity="0.8"/>
    
    <!-- Sauce accent -->
    <path d="M 500 340 Q 550 360 600 350 Q 650 340 700 345" stroke="#8b4513" stroke-width="2" fill="none" opacity="0.6"/>
    
    <!-- Micro garnish -->
    <circle cx="580" cy="180" r="8" fill="#10b981" opacity="0.8"/>
    <circle cx="620" cy="190" r="7" fill="#fbbf24" opacity="0.8"/>
  </g>
  
  <!-- Fine dining indicators -->
  <g opacity="0.8">
    <text x="200" y="140" font-size="24" fill="#fbbf24" font-weight="bold">★ Premium Selection</text>
  </g>
  
  <!-- Revenue metrics -->
  <g opacity="0.6">
    <text x="300" y="500" font-size="20" fill="#fbbf24">AOV: $48</text>
    <text x="900" y="500" font-size="20" fill="#fbbf24">Margin: +38%</text>
  </g>
  
  <!-- Text -->
  <text x="600" y="540" font-size="40" font-weight="bold" text-anchor="middle" fill="#fbbf24" opacity="0.9">Fine Dining Experience</text>
  <text x="600" y="580" font-size="18" text-anchor="middle" fill="#e0e7ff" opacity="0.7">Signature dish with premium presentation</text>
</svg>