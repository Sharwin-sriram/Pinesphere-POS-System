<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bgGradient)"/>
  
  <!-- Restaurant interior representation -->
  <rect x="50" y="80" width="1100" height="450" rx="20" fill="none" stroke="#8b5cf6" stroke-width="2" opacity="0.3"/>
  
  <!-- Ceiling lights -->
  <circle cx="200" cy="100" r="30" fill="#fbbf24" opacity="0.6"/>
  <circle cx="600" cy="100" r="30" fill="#fbbf24" opacity="0.6"/>
  <circle cx="1000" cy="100" r="30" fill="#fbbf24" opacity="0.6"/>
  
  <!-- Tables -->
  <rect x="150" y="250" width="200" height="180" rx="10" fill="#1a1a2e" stroke="#8b5cf6" stroke-width="2" opacity="0.7"/>
  <rect x="500" y="220" width="220" height="200" rx="10" fill="#1a1a2e" stroke="#3b82f6" stroke-width="2" opacity="0.7"/>
  <rect x="850" y="250" width="200" height="180" rx="10" fill="#1a1a2e" stroke="#8b5cf6" stroke-width="2" opacity="0.7"/>
  
  <!-- Dining elements -->
  <circle cx="250" cy="330" r="40" fill="#fbbf24" opacity="0.4"/>
  <circle cx="600" cy="320" r="45" fill="#10b981" opacity="0.4"/>
  <circle cx="950" cy="330" r="40" fill="#f87171" opacity="0.4"/>
  
  <!-- Premium text -->
  <text x="600" y="530" font-size="48" font-weight="bold" text-anchor="middle" fill="#8b5cf6" opacity="0.9">Premium Dining Experience</text>
  <text x="600" y="575" font-size="24" text-anchor="middle" fill="#e0e7ff" opacity="0.7">Modern restaurant ambiance with elegant dining</text>
</svg>