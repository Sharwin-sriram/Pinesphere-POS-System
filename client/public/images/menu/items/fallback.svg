<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="plate" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#f5f5dc;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#d4af37;stop-opacity:0.7" />
    </radialGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bgGradient)"/>
  
  <!-- Main plate -->
  <circle cx="600" cy="300" r="220" fill="url(#plate)" stroke="#8b5cf6" stroke-width="2" opacity="0.7"/>
  <circle cx="600" cy="300" r="210" fill="#1a1a2e" stroke="#e0e7ff" stroke-width="1" opacity="0.3"/>
  
  <!-- Food representation -->
  <g opacity="0.85">
    <ellipse cx="600" cy="280" rx="100" ry="80" fill="#c97f3a"/>
    <circle cx="570" cy="260" r="25" fill="#22c55e" opacity="0.8"/>
    <circle cx="630" cy="270" r="28" fill="#fbbf24" opacity="0.8"/>
    <circle cx="600" cy="320" r="30" fill="#f87171" opacity="0.7"/>
  </g>
  
  <!-- Decorative elements -->
  <g opacity="0.4">
    <circle cx="450" cy="200" r="15" fill="#8b5cf6"/>
    <circle cx="750" cy="210" r="12" fill="#3b82f6"/>
    <circle cx="480" cy="400" r="10" fill="#10b981"/>
    <circle cx="720" cy="420" r="13" fill="#fbbf24"/>
  </g>
  
  <!-- Text -->
  <text x="600" y="500" font-size="40" font-weight="bold" text-anchor="middle" fill="#8b5cf6" opacity="0.9">Menu Item</text>
  <text x="600" y="550" font-size="18" text-anchor="middle" fill="#e0e7ff" opacity="0.7">Premium restaurant offering</text>
</svg>
