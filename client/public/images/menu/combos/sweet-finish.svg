<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bgGradient)"/>
  
  <!-- Dessert combo arrangement -->
  <g opacity="0.85">
    <!-- Cake portion -->
    <rect x="250" y="180" width="180" height="200" rx="15" fill="#8b4513" stroke="#ff69b4" stroke-width="2"/>
    <rect x="260" y="170" width="160" height="30" rx="10" fill="#d4af37"/>
    <circle cx="340" cy="160" r="20" fill="#fbbf24" opacity="0.8"/>
    
    <!-- Coffee cup -->
    <rect x="560" y="240" width="100" height="120" rx="10" fill="#8b6f47" stroke="#d4af37" stroke-width="2"/>
    <ellipse cx="610" cy="240" rx="55" ry="15" fill="#a0896d"/>
    <path d="M 620 280 Q 670 290 675 260" fill="none" stroke="#d4af37" stroke-width="3" opacity="0.7"/>
    
    <!-- Macaron or small pastry -->
    <circle cx="850" cy="240" r="50" fill="#ff69b4" stroke="#ffb6c1" stroke-width="2"/>
    <circle cx="850" cy="240" r="40" fill="#ffb6c1" opacity="0.8"/>
    <circle cx="830" cy="220" r="12" fill="#fbbf24" opacity="0.7"/>
  </g>
  
  <!-- Sweet indicator -->
  <g opacity="0.6">
    <text x="200" y="120" font-size="24" fill="#ff69b4" font-weight="bold">🍰 Sweet Finish</text>
  </g>
  
  <!-- Price -->
  <g>
    <rect x="450" y="380" width="300" height="70" rx="15" fill="#ff69b4" opacity="0.3" stroke="#ff69b4" stroke-width="2"/>
    <text x="600" y="415" font-size="28" font-weight="bold" text-anchor="middle" fill="#fbbf24">$18.00</text>
    <text x="600" y="440" font-size="16" text-anchor="middle" fill="#e0e7ff" opacity="0.8">Indulgent Desserts</text>
  </g>
  
  <!-- Text -->
  <text x="600" y="530" font-size="40" font-weight="bold" text-anchor="middle" fill="#ff69b4" opacity="0.9">Sweet Finish Combo</text>
  <text x="600" y="575" font-size="18" text-anchor="middle" fill="#e0e7ff" opacity="0.7">Perfect dessert pairing for two</text>
</svg>