<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bgGradient)"/>
  
  <!-- Combo meal arrangement - multiple components -->
  <g opacity="0.85">
    <!-- Main protein -->
    <ellipse cx="300" cy="280" rx="90" ry="80" fill="#c97f3a" stroke="#8b5cf6" stroke-width="2"/>
    <ellipse cx="300" cy="280" rx="80" ry="70" fill="#a0522d"/>
    
    <!-- Side dish -->
    <ellipse cx="600" cy="260" rx="85" ry="75" fill="#7cb342" stroke="#10b981" stroke-width="2"/>
    <ellipse cx="600" cy="260" rx="75" ry="65" fill="#558b2f"/>
    
    <!-- Beverage -->
    <rect x="875" y="180" width="70" height="150" rx="10" fill="#4ecdc4" stroke="#3b82f6" stroke-width="2"/>
    <ellipse cx="910" cy="180" rx="40" ry="12" fill="#5ee7de"/>
    
    <!-- Garnish -->
    <circle cx="920" cy="120" r="15" fill="#fbbf24" opacity="0.7"/>
  </g>
  
  <!-- Price tag -->
  <g>
    <rect x="450" y="380" width="300" height="80" rx="15" fill="#8b5cf6" opacity="0.3" stroke="#8b5cf6" stroke-width="2"/>
    <text x="600" y="415" font-size="32" font-weight="bold" text-anchor="middle" fill="#fbbf24">$68.00</text>
    <text x="600" y="450" font-size="18" text-anchor="middle" fill="#e0e7ff" opacity="0.8">Combo Bundle Deal</text>
  </g>
  
  <!-- Text -->
  <text x="600" y="530" font-size="40" font-weight="bold" text-anchor="middle" fill="#10b981" opacity="0.9">Family Feast Combo</text>
  <text x="600" y="575" font-size="18" text-anchor="middle" fill="#e0e7ff" opacity="0.7">Complete meal for everyone at your table</text>
</svg>