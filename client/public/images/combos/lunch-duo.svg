<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bgGradient)"/>
  
  <!-- Lunch combo arrangement -->
  <g opacity="0.85">
    <!-- Main item -->
    <ellipse cx="350" cy="280" rx="100" ry="85" fill="#c97f3a" stroke="#8b5cf6" stroke-width="2"/>
    
    <!-- Side item -->
    <rect x="520" y="240" width="120" height="100" rx="10" fill="#7cb342" stroke="#10b981" stroke-width="2"/>
    <circle cx="580" cy="270" r="20" fill="#fbbf24" opacity="0.6"/>
    
    <!-- Beverage -->
    <rect x="800" y="200" width="60" height="140" rx="10" fill="#4ecdc4" stroke="#3b82f6" stroke-width="2"/>
    <ellipse cx="830" cy="200" rx="35" ry="10" fill="#5ee7de"/>
    
    <!-- Decorative straws -->
    <line x1="810" y1="180" x2="815" y2="140" stroke="#fbbf24" stroke-width="2"/>
    <line x1="850" y1="180" x2="845" y2="140" stroke="#fbbf24" stroke-width="2"/>
  </g>
  
  <!-- Speed indicator -->
  <g opacity="0.6">
    <text x="200" y="150" font-size="24" fill="#10b981" font-weight="bold">⚡ Quick Lunch</text>
  </g>
  
  <!-- Price -->
  <g>
    <rect x="450" y="380" width="300" height="70" rx="15" fill="#8b5cf6" opacity="0.3" stroke="#8b5cf6" stroke-width="2"/>
    <text x="600" y="415" font-size="28" font-weight="bold" text-anchor="middle" fill="#fbbf24">$28.00</text>
    <text x="600" y="440" font-size="16" text-anchor="middle" fill="#e0e7ff" opacity="0.8">Perfect for Lunch</text>
  </g>
  
  <!-- Text -->
  <text x="600" y="530" font-size="40" font-weight="bold" text-anchor="middle" fill="#10b981" opacity="0.9">Lunch Duo Special</text>
  <text x="600" y="575" font-size="18" text-anchor="middle" fill="#e0e7ff" opacity="0.7">Satisfying meal ready in minutes</text>
</svg>