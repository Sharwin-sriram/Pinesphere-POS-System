<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bgGradient)"/>
  
  <!-- Teriyaki chicken representation -->
  <g opacity="0.9">
    <!-- Plate -->
    <circle cx="600" cy="300" r="200" fill="#d4af37" opacity="0.3" stroke="#8b5cf6" stroke-width="2"/>
    
    <!-- Teriyaki glaze -->
    <ellipse cx="600" cy="280" rx="110" ry="90" fill="#3d2817" opacity="0.9"/>
    <ellipse cx="600" cy="280" rx="100" ry="80" fill="#5c3d2e"/>
    
    <!-- Garnish -->
    <circle cx="560" cy="240" r="20" fill="#fbbf24" opacity="0.7"/>
    <circle cx="640" cy="250" r="18" fill="#10b981" opacity="0.7"/>
    <ellipse cx="580" cy="320" rx="30" ry="15" fill="#ff6b6b" opacity="0.6"/>
  </g>
  
  <!-- Spicy indicator -->
  <g opacity="0.7">
    <text x="200" y="120" font-size="28" fill="#ef4444">★ ★ ★</text>
  </g>
  
  <!-- Text -->
  <text x="600" y="500" font-size="40" font-weight="bold" text-anchor="middle" fill="#fbbf24" opacity="0.9">Spicy Teriyaki</text>
  <text x="600" y="550" font-size="18" text-anchor="middle" fill="#e0e7ff" opacity="0.7">Premium glazed protein with bold flavors</text>
</svg>